; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
lib_deps = 
	lovyan03/LovyanGFX@^1.2.32
	madhephaestus/ESP32Servo@^3.2.1
	fastled/FastLED@3.9.16
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = 
	-<hardware_tests/uhf_test.cpp>
	-<hardware_tests/servo_test.cpp>
	-<hardware_tests/ledstrip_test.cpp>
	-<hardware_tests/sound_test.cpp>
	-<hardware_tests/touchsensor_test.cpp>
	-<hardware_tests/display_test.cpp>
	+<main.cpp>
	-<simple.cpp>
